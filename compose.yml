version: "3.9"

services:
  frontend:
    container_name: chess-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: yarn start

  backend:
    container_name: chess-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3030:3030
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgresql:5432/chess"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:16.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
