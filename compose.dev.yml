services:
  frontend:
    container_name: chess-frontend
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - 3000:3000
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped

  backend:
    container_name: chess-backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - 3030:3030
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy

  chess-bot:
    container_name: chess-bot
    build:
      context: ./chess-bot
      dockerfile: dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./chess-bot/src:/app/src
    restart: unless-stopped
    command: uv run fastapi dev src/main.py --host 0.0.0.0

  postgresql:
    image: postgres:16.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend:
